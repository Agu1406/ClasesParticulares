plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group 'org.agu1406'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
    javafxVersion = '21.0.6'
}

sourceCompatibility = '21'
targetCompatibility = '21'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude '**/ignorar/**'
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
            exclude '**/*.md'
            exclude '**/ignorar/**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

application {
    mainClass = findProperty('mainClass') ?: 'ev2.ut5_pooexcepcionesio.teoria.U02_FXMLLoaderIntro'
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls', 'javafx.fxml']
}

def javafxOs = {
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isWindows()) return 'win'
    if (os.isMacOsX()) return 'mac'
    if (os.isLinux()) return 'linux'
    throw new GradleException('Sistema operativo no soportado para JavaFX')
}()

dependencies {
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxOs}"
    implementation "org.openjfx:javafx-fxml:${javafxVersion}:${javafxOs}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
}

// IntelliJ (Build and run using Gradle) crea tareas "*.main()" sin JavaFX.
tasks.withType(JavaExec).configureEach { exec ->
    if (exec.name.endsWith('.main()')) {
        exec.doFirst {
            def allJars = exec.classpath.files
            def javafxJars = allJars.findAll { it.name.startsWith('javafx-') }
            def appJars = allJars.findAll { !it.name.startsWith('javafx-') }
            exec.jvmArgs += [
                '--module-path', javafxJars.collect { it.absolutePath }.join(File.pathSeparator),
                '--add-modules', 'javafx.controls,javafx.fxml'
            ]
            exec.classpath = files(appJars)
        }
    }
}

test {
    useJUnitPlatform()
}