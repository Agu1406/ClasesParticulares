<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tests de Programacion - Pruebas Libres</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-5xl px-4 py-8 md:px-6">
      <header class="mb-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 md:text-3xl">
          Tests de Programacion - Pruebas Libres
        </h1>
        <p class="mt-2 text-sm text-slate-600 md:text-base">
          Elige el examen, responde y corrige al final. PDFs en
          <code class="rounded bg-slate-100 px-1.5 py-0.5 text-slate-800">src/pruebaslibres/Pruebas_libres_20XX.pdf</code>.
        </p>
      </header>

      <section class="mb-6 rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <div class="flex flex-col gap-3 md:flex-row md:items-end">
          <div class="flex-1">
            <label for="selector-examen" class="mb-1 block text-sm font-semibold text-slate-700">
              Selecciona un examen
            </label>
            <select
              id="selector-examen"
              class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200"
            >
              <optgroup label="Examenes oficiales por año">
                <option value="programacion2021">Programacion - Pruebas libres 2021 (40 preguntas)</option>
                <option value="programacion2022">Programacion - Pruebas libres 2022 (40 preguntas)</option>
                <option value="programacion2023">Programacion - Pruebas libres 2023 (40 preguntas)</option>
                <option value="programacion2024">
                  Programacion - Pruebas libres 2024 (provisional = 2023 hasta OCR/transcripcion)
                </option>
                <option value="programacion2025">Programacion - Pruebas libres 2025 DAW (40 preguntas)</option>
              </optgroup>
              <optgroup label="Ruta real 23-24-25 (nueva)">
                <option value="rutaReal2023">Ruta real - Base 2023 (40 preguntas)</option>
                <option value="rutaReal2024">Ruta real - Base 2024 (40 preguntas)</option>
                <option value="rutaReal2025">Ruta real - Base 2025 (40 preguntas)</option>
                <option value="rutaRealSimulacroA">Ruta real - Simulacro A mixto (40 preguntas)</option>
                <option value="rutaRealSimulacroB">Ruta real - Simulacro B mixto (40 preguntas)</option>
                <option value="rutaRealSimulacroC">Ruta real - Simulacro C mixto (40 preguntas)</option>
                <option value="rutaRealRA1">Ruta real - Bloque RA1 aprox (3 preguntas)</option>
                <option value="rutaRealRA2">Ruta real - Bloque RA2 aprox (3 preguntas)</option>
                <option value="rutaRealRA3">Ruta real - Bloque RA3 aprox (6 preguntas)</option>
                <option value="rutaRealRA4">Ruta real - Bloque RA4 aprox (6 preguntas)</option>
                <option value="rutaRealRA5">Ruta real - Bloque RA5 aprox (4 preguntas)</option>
                <option value="rutaRealRA6">Ruta real - Bloque RA6 aprox (7 preguntas)</option>
                <option value="rutaRealRA7">Ruta real - Bloque RA7 aprox (6 preguntas)</option>
                <option value="rutaRealRA8">Ruta real - Bloque RA8 aprox (3 preguntas)</option>
                <option value="rutaRealRA9">Ruta real - Bloque RA9 aprox (2 preguntas)</option>
              </optgroup>
              <optgroup label="Plan de 12 dias (mixto 2021-2025)">
                <option value="planDia01_diagnostico">Dia 1 - Diagnostico (20 preguntas)</option>
                <option value="planDia02_fundamentos">Dia 2 - Fundamentos y operadores (20 preguntas)</option>
                <option value="planDia03_poo_static_valor">Dia 3 - POO, static y paso por valor (20 preguntas)</option>
                <option value="planDia04_excepciones_ficheros">Dia 4 - Excepciones y ficheros (20 preguntas)</option>
                <option value="planDia05_colecciones_interfaces">Dia 5 - Colecciones e interfaces (20 preguntas)</option>
                <option value="planDia06_arrays_recursion_reflection">Dia 6 - Arrays, recursion y reflection (20 preguntas)</option>
                <option value="planDia07_jdbc">Dia 7 - JDBC (20 preguntas)</option>
                <option value="planDia08_streams_serializacion_json">Dia 8 - Streams, serializacion y JSON (20 preguntas)</option>
                <option value="planDia09_orm_hibernate">Dia 9 - ORM e Hibernate (20 preguntas)</option>
                <option value="planDia10_javafx_ui">Dia 10 - JavaFX e interfaz (20 preguntas)</option>
                <option value="planDia11_simulacro1">Dia 11 - Simulacro 1 (20 preguntas)</option>
                <option value="planDia12_simulacro2">Dia 12 - Simulacro 2 (20 preguntas)</option>
              </optgroup>
              <optgroup label="Plan de 12 dias B (progresivo y no repeticion)">
                <option value="planB_dia01_diagnostico">B Dia 1 - Diagnostico facil (20 preguntas)</option>
                <option value="planB_dia02_fundamentos">B Dia 2 - Fundamentos facil (20 preguntas)</option>
                <option value="planB_dia03_poo_static_valor">B Dia 3 - POO/media (20 preguntas)</option>
                <option value="planB_dia04_excepciones_ficheros">B Dia 4 - Excepciones/media (20 preguntas)</option>
                <option value="planB_dia05_colecciones_interfaces">B Dia 5 - Colecciones/media (20 preguntas)</option>
                <option value="planB_dia06_arrays_recursion_reflection">B Dia 6 - Arrays/media (20 preguntas)</option>
                <option value="planB_dia07_jdbc">B Dia 7 - JDBC alta (20 preguntas)</option>
                <option value="planB_dia08_streams_serializacion_json">B Dia 8 - Streams/JSON alta (20 preguntas)</option>
                <option value="planB_dia09_orm_hibernate">B Dia 9 - ORM/Hibernate alta (20 preguntas)</option>
                <option value="planB_dia10_javafx_ui">B Dia 10 - JavaFX alta (20 preguntas)</option>
                <option value="planB_dia11_simulacro1">B Dia 11 - Simulacro 1 alta (20 preguntas)</option>
                <option value="planB_dia12_simulacro2">B Dia 12 - Simulacro 2 alta (20 preguntas)</option>
              </optgroup>
            </select>
          </div>
          <button
            id="boton-cargar-examen"
            class="inline-flex h-10 items-center justify-center rounded-xl bg-sky-600 px-4 text-sm font-semibold text-white transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-300"
          >
            Cargar examen
          </button>
        </div>
      </section>

      <section id="zona-preguntas" class="space-y-4">
        <!-- Las preguntas se generan desde script.js -->
      </section>

      <section id="zona-resultados" class="hidden mt-6 rounded-2xl border border-emerald-200 bg-emerald-50 p-4">
        <h2 class="text-lg font-semibold text-emerald-900">Resultado</h2>
        <p id="texto-resultado" class="mt-1 text-sm text-emerald-800 md:text-base"></p>
      </section>

      <div class="mt-6 flex justify-center">
        <button
          id="boton-corrector"
          class="inline-flex h-11 items-center justify-center rounded-xl bg-emerald-600 px-6 text-sm font-semibold text-white transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-300"
        >
          Corregir test
        </button>
      </div>
    </main>

    <!-- Datos de examenes (orden: del mas antiguo al mas reciente) -->
    <script src="data/programacion2021.js"></script>
    <script src="data/programacion2022.js"></script>
    <script src="data/programacion2023.js"></script>
    <script src="data/programacion2024.js"></script>
    <script src="data/programacion2025.js"></script>
    <script src="data/plan12dias.js"></script>
    <script src="data/rutaReal232425.js"></script>
    <script src="script.js"></script>
  </body>
</html>
