    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>
    <script>
      let vantaEffect = null;

      function iniciarVanta() {
        if (vantaEffect) {
          vantaEffect.destroy();
          vantaEffect = null;
        }
        vantaEffect = VANTA.TOPOLOGY({
          el: "#vanta-topology",
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          minHeight: 200.0,
          minWidth: 200.0,
          scale: 1.0,
          scaleMobile: 1.0,
          backgroundColor: 0x2222,
          color: 0x89964e,
        });
      }

      document.addEventListener("DOMContentLoaded", iniciarVanta);
      window.addEventListener("focus", iniciarVanta);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          iniciarVanta();
        }
      });
    </script>
