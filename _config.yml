# Configuración de Jekyll para GitHub Pages
# Excluir todas las carpetas y archivos Markdown excepto tests/ del procesamiento
exclude:
  - clases-android/
  - clases-c/
  - clases-cpp/
  - clases-interfaces-web/
  - clases-java/
  - clases-javafx-gradle/
  - clases-php/
  - clases-python/
  - clases-react-native/
  - clases-sql/
  - guia-commits.txt
  - README.md
  - "**/node_modules/"
  - "**/.git/"

# Desactivar plugins que no necesitamos
plugins: []

# Configuración básica
safe: true
source: .
destination: ./_site

